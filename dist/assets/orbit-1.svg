<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="840" viewBox="0 0 1440 840"><defs><filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="18" stdDeviation="20" flood-opacity=".16"/></filter><pattern id="grain" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="1" cy="2" r=".6" fill="#000" opacity=".08"/></pattern></defs><rect width="1440" height="840" fill="#b29bdf"/><g transform="translate(115 75) rotate(-3 540 320)" filter="url(#shadow)"><rect width="1080" height="660" rx="18" fill="#f7f5fc"/><rect width="1080" height="43" rx="18" fill="#edeaf4"/><circle cx="23" cy="22" r="5" fill="#c6b5f5"/><circle cx="42" cy="22" r="5" fill="#d2d8bb"/><circle cx="61" cy="22" r="5" fill="#e7c3d2"/><text x="455" y="28" font-family="Arial,Helvetica,sans-serif" font-size="12" fill="#6a6379" >orbit — your creative space</text><path d="M200 44v616" stroke="#ded9e8"/><text x="25" y="100" font-family="Arial,Helvetica,sans-serif" font-size="38" fill="#493a66" font-weight="700" letter-spacing="-2">orbit</text><text x="25" y="175" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#746c82" >⌕  Search</text><text x="25" y="225" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#493a66" >◉  My space</text><text x="25" y="272" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#746c82" >▦  Collections</text><text x="25" y="320" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#746c82" >♡  Inspiration</text><text x="245" y="120" font-family="Arial,Helvetica,sans-serif" font-size="38" fill="#493a66" font-weight="700" letter-spacing="-2">A little space to think.</text><text x="245" y="152" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#746c82" >Catch an idea. See where it takes you.</text><rect x="245" y="195" width="330" height="210" rx="12" fill="#e6d983"/><text x="270" y="260" font-family="Arial,Helvetica,sans-serif" font-size="40" fill="#493a66" font-weight="700">Today’s</text><text x="270" y="305" font-family="Arial,Helvetica,sans-serif" font-size="40" fill="#493a66" font-weight="700">little idea.</text><rect x="595" y="195" width="410" height="210" rx="12" fill="#d4c4ef"/><ellipse cx="800" cy="295" rx="140" ry="55" fill="none" stroke="#7655ad" stroke-width="18" transform="rotate(-25 800 295)"/><circle cx="800" cy="295" r="55" fill="#b198dc"/><rect x="245" y="425" width="410" height="185" rx="12" fill="#cadbd2"/><text x="270" y="485" font-family="Arial,Helvetica,sans-serif" font-size="32" fill="#493a66" font-weight="700">Make room for</text><text x="270" y="530" font-family="Arial,Helvetica,sans-serif" font-size="32" fill="#493a66" font-weight="700">something new.</text><rect x="675" y="425" width="330" height="185" rx="12" fill="#edd0d9"/><text x="700" y="485" font-family="Arial,Helvetica,sans-serif" font-size="32" fill="#493a66" font-weight="700">A fresh</text><text x="700" y="530" font-family="Arial,Helvetica,sans-serif" font-size="32" fill="#493a66" font-weight="700">perspective.</text></g><g transform="translate(1110 315) rotate(8)" filter="url(#shadow)"><rect width="230" height="440" rx="33" fill="#352d45"/><rect x="9" y="10" width="212" height="420" rx="27" fill="#f7f5fc"/><rect x="75" y="20" width="80" height="20" rx="10" fill="#352d45"/><text x="28" y="95" font-family="Arial,Helvetica,sans-serif" font-size="32" fill="#493a66" font-weight="700">orbit</text><rect x="24" y="125" width="182" height="165" rx="12" fill="#d4c4ef"/><text x="40" y="185" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#493a66" font-weight="700">Your next</text><text x="40" y="222" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#493a66" font-weight="700">big thing.</text><rect x="24" y="310" width="182" height="65" rx="12" fill="#e6d983"/><text x="43" y="350" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#493a66" >Start somewhere ↗</text></g><rect width="1440" height="840" fill="url(#grain)" opacity=".3"